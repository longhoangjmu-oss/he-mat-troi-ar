
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Khám phá Hệ Mặt Trời AR</title>

  <!-- Thu vien hien thi 3D -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Thu vien nhan dien anh AR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050816;
    }

    #intro {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 14px;
      color: white;
      text-align: center;
      background: rgba(8, 15, 42, 0.88);
      border: 1px solid rgba(130, 170, 255, 0.5);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(55, 120, 255, 0.2);
    }

    #intro h1 {
      margin: 0 0 7px;
      font-size: 20px;
      color: #ffe08a;
    }

    #intro p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      margin-top: 7px;
      color: #8fe8ff;
      font-size: 12px;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="intro">
    <h1>🌌 KHÁM PHÁ HỆ MẶT TRỜI</h1>
    <p>Đưa camera đến gần ảnh mục tiêu để khám phá vũ trụ 3D.</p>
    <div id="status">Đang khởi tạo AR...</div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./target.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <a-mixin
        id="sunMaterial"
        material="color: #FFD54F; emissive: #FF9800; emissiveIntensity: 0.8">
      </a-mixin>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Toan bo mo hinh hien ra khi nhan dien target so 0 -->
    <a-entity
      id="solar-system"
      mindar-image-target="targetIndex: 0">

      <!-- Mat Troi -->
      <a-sphere
        position="0 0.35 0"
        radius="0.25"
        material="color: #FFD54F; emissive: #FF9800; emissiveIntensity: 0.9">
      </a-sphere>

      <a-text
        value="MAT TROI"
        position="0 0.68 0"
        align="center"
        color="#FFE8A3"
        width="1.5">
      </a-text>

      <!-- Sao Thuy -->
      <a-sphere
        position="-0.65 0.1 0"
        radius="0.07"
        material="color: #A8A8A8">
      </a-sphere>
      <a-text
        value="Sao Thuy"
        position="-0.65 -0.05 0"
        align="center"
        color="#FFFFFF"
        width="1">
      </a-text>

      <!-- Sao Kim -->
      <a-sphere
        position="0.65 0.1 0"
        radius="0.11"
        material="color: #E7B66D">
      </a-sphere>
      <a-text
        value="Sao Kim"
        position="0.65 -0.08 0"
        align="center"
        color="#FFFFFF"
        width="1">
      </a-text>

      <!-- Trai Dat -->
      <a-sphere
        position="0 0.1 0.65"
        radius="0.13"
        material="color: #2878D0">
      </a-sphere>
      <a-sphere
        position="0 0.1 0.65"
        radius="0.132"
        scale="1 0.55 1"
        material="color: #49B675; transparent: true; opacity: 0.9">
      </a-sphere>
      <a-text
        value="Trai Dat"
        position="0 -0.12 0.65"
        align="center"
        color="#FFFFFF"
        width="1">
      </a-text>

      <!-- Sao Hoa -->
      <a-sphere
        position="0 0.1 -0.65"
        radius="0.10"
        material="color: #E85D3F">
      </a-sphere>
      <a-text
        value="Sao Hoa"
        position="0 -0.08 -0.65"
        align="center"
        color="#FFFFFF"
        width="1">
      </a-text>

      <!-- Sao Moc -->
      <a-sphere
        position="-0.95 0.1 0.5"
        radius="0.19"
        material="color: #D8A16B">
      </a-sphere>
      <a-text
        value="Sao Moc"
        position="-0.95 -0.16 0.5"
        align="center"
        color="#FFFFFF"
        width="1">
      </a-text>

      <!-- Sao Tho -->
      <a-sphere
        position="0.95 0.1 -0.5"
        radius="0.17"
        material="color: #D8C08A">
      </a-sphere>
      <a-ring
        position="0.95 0.1 -0.5"
        rotation="75 0 0"
        radius-inner="0.22"
        radius-outer="0.29"
        material="color: #F0D7A0; side: double">
      </a-ring>
      <a-text
        value="Sao Tho"
        position="0.95 -0.15 -0.5"
        align="center"
        color="#FFFFFF"
        width="1">
      </a-text>

      <!-- Sao Thien Vuong -->
      <a-sphere
        position="-0.5 0.1 -0.95"
        radius="0.14"
        material="color: #83DDE5">
      </a-sphere>
      <a-text
        value="Thien Vuong"
        position="-0.5 -0.12 -0.95"
        align="center"
        color="#FFFFFF"
        width="1.2">
      </a-text>

      <!-- Sao Hai Vuong -->
      <a-sphere
        position="0.5 0.1 0.95"
        radius="0.14"
        material="color: #4169E1">
      </a-sphere>
      <a-text
        value="Hai Vuong"
        position="0.5 -0.12 0.95"
        align="center"
        color="#FFFFFF"
        width="1.2">
      </a-text>

      <!-- Tieu de mo hinh -->
      <a-text
        value="HE MAT TROI"
        position="0 0.95 0"
        align="center"
        color="#8FE8FF"
        width="2.5">
      </a-text>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#solar-system");
    const statusText = document.querySelector("#status");

    target.addEventListener("targetFound", function () {
      statusText.textContent = "Da nhan dien anh! Chao mung den voi vu tru.";
    });

    target.addEventListener("targetLost", function () {
      statusText.textContent = "Hay huong camera lai vao anh muc tieu.";
    });

    scene.addEventListener("arReady", function () {
      statusText.textContent = "Camera san sang. Hay quet anh muc tieu!";
    });

    scene.addEventListener("arError", function () {
      statusText.textContent = "AR gap loi. Hay kiem tra quyen camera va ket noi mang.";
    });
  </script>

</body>
</html>
